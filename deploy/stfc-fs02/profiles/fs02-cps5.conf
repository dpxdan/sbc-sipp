# fs02-cps5 - 5 CPS por 180 s com RTP nos dois sentidos (rampa de 1 em 1 CPS a cada 10 s)
# Regime: ~5 x 20 = 100 chamadas simultaneas = ~200 sessoes no FS (entrada + bridge).
# Equivale a: flux-loadtest.sh run --confirm-prod -y -t sip -r 5 --cps-start 1 --ramp-step 1 -H 20 -w 180

DESC="FS02 5 CPS por 180 s, hold 20 s, RTP"
ZABBIX_ENABLED=1
TESTS=sip
CPS=5
CPS_START=1
RAMP_STEP=1
RAMP_INTERVAL=10
WINDOW=180
HOLD=20
MEDIA=rtp
LABEL=fs02-cps5
