# fs02-cps10 - 10 CPS por 300 s com RTP (rampa de 2 em 2 CPS a cada 15 s)
# Regime: ~10 x 20 = 200 simultaneas = ~400 sessoes. Cada chamada abre 2 sessoes no FS: com
# sessions-per-second=30 no switch.conf, o teto pratico do .162 e ~15 CPS.
# Equivale a: flux-loadtest.sh run --confirm-prod -y -t sip -r 10 --cps-start 2 --ramp-step 2 --ramp-interval 15 -H 20 -w 300

DESC="FS02 10 CPS por 300 s, hold 20 s, RTP"
ZABBIX_ENABLED=1
TESTS=sip
CPS=10
CPS_START=2
RAMP_STEP=2
RAMP_INTERVAL=15
WINDOW=300
HOLD=20
MEDIA=rtp
LABEL=fs02-cps10
