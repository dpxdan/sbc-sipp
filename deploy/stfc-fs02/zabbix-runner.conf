# /etc/flux-loadtest/zabbix-runner.conf - limites do disparo pelo Zabbix no .165 (bin/flux-loadtest-zbx)
# Teto abaixo do limite pratico do .162 (~15 CPS: sessions-per-second=30 e 2 sessoes por chamada).
FLT_BIN=/opt/flux-loadtest/flux-loadtest.sh
FLT_CONF=/etc/flux-loadtest/loadtest.conf
PROFILES_DIR=/etc/flux-loadtest/profiles.d
ZBX_MAX_CPS=12
ZBX_MAX_WINDOW=600
