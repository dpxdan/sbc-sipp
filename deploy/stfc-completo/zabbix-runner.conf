# zabbix-runner.conf do STFC - limites do disparo pelo Zabbix (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/zabbix-runner.conf no .165 ANTES do "flux-host.sh prepare zabbix-agent":
# com um teto menor, os perfis acima dele ficam fora do include do agent.
# ZBX_MAX_CPS=300 e a maior meta da WEB-1437. O teto nao e a capacidade medida: 50 CPS em 28/10/2026.
# Formato CHAVE=valor, lido como dado (nunca executado).

FLT_BIN=/opt/flux-loadtest/flux-loadtest.sh
FLT_CONF=/etc/flux-loadtest/loadtest.conf
PROFILES_DIR=/etc/flux-loadtest/profiles.d
STATE_FILE=/var/lib/flux-loadtest/zbx-state.json
ZBX_MAX_CPS=300
ZBX_MAX_WINDOW=3600
