# stfc-cps90-rtp-escada - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-cps90-rtp-escada.conf no .165 (ZABBIX.md).
# T2 da migracao: limite com RTP em todas as chamadas (pior caso). De 30 a 90 CPS (+15/120 s) e 3 min em 90. ~14 min.
#
# ANTES de disparar (docs/execucao/migracao-14-11.md):
#   - nos dois FS: bash fs-limites.sh aplicar 150 1260 (mantem os limites maiores do switch.conf)
#   - GUARD_MAX_PDD_MS, GUARD_MAX_OS_SHM_PCT e GUARD_MAX_DB_CONN_PCT no loadtest.conf (o wrapper exige)
#   - DIDs com bypass_media = 1 (bypass desativado no FluxSBC) e firewall do .165 liberando as faixas RTP vindas dos FS
# Depois da execucao, nos dois FS: bash fs-limites.sh restaurar

DESC="STFC escada com RTP: 30 a 90 CPS (+15 a cada 120 s), hold 10 s. EXIGE bypass_media 1 e fs-limites 150 1260"
ZABBIX_ENABLED=1
TESTS=sip
CPS=90
CPS_START=30
RAMP_STEP=15
RAMP_INTERVAL=120
WINDOW=660
HOLD=10
MEDIA=rtp
LABEL=stfc-cps90-rtp-escada
