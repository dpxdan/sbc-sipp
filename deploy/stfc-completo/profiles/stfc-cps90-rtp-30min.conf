# stfc-cps90-rtp-30min - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-cps90-rtp-30min.conf no .165 (ZABBIX.md).
# 90 CPS sustentados com RTP em todas as chamadas. Rampa de 45 a 90 (+9/60 s) e 30 min em 90. ~38 min.
#
# ANTES de disparar (docs/execucao/migracao-14-11.md):
#   - nos dois FS: bash fs-limites.sh aplicar 150 1260 (mantem os limites maiores do switch.conf)
#   - GUARD_MAX_PDD_MS, GUARD_MAX_OS_SHM_PCT e GUARD_MAX_DB_CONN_PCT no loadtest.conf (o wrapper exige)
#   - DIDs com bypass_media = 1 (bypass desativado no FluxSBC) e firewall do .165 liberando as faixas RTP vindas dos FS
# Depois da execucao, nos dois FS: bash fs-limites.sh restaurar

DESC="STFC 90 CPS com RTP por 30 min, rampa de 45 a 90, hold 10 s. EXIGE bypass_media 1 e fs-limites 150 1260"
ZABBIX_ENABLED=1
TESTS=sip
CPS=90
CPS_START=45
RAMP_STEP=9
RAMP_INTERVAL=60
WINDOW=2100
HOLD=10
MEDIA=rtp
LABEL=stfc-cps90-rtp-30min
