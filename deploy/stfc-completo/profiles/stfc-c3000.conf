# stfc-c3000 - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-c3000.conf no .165 (ZABBIX.md).
# 3000 chamadas simultaneas a 10 CPS (chamadas de 300 s): degrau do A14 (RESULTADOS.md, secao 8).
# Patamar de 120 s em 3000 simultaneas; ~16 min com baseline, drenagem e cooldown.
#
# ANTES de disparar (ZABBIX.md, "Perfis de 2000, 3000 e 5000 simultaneas"):
#   - nos dois FS: bash fs-limites.sh aplicar 150 4200
#   - no .163: opensips-cli -x mi lb_list mostrando max perto de 4200 x CPU ociosa nos dois nos
# Regra: max_sessions = 1,4 x simultaneas. 2 sessoes por chamada e o load_balancer manda ate
# ~55% para o .162 (mais CPU ociosa); em 27/10/2026, com 3500, o .162 chegou a 91,6%.
# Com max_sessions 5000 em uso (fs-limites.sh mostrar), o aplicar mantem 5000 e o perfil cabe.
# Abaixo de 4200, o FS chega ao teto e responde 503 tambem para as chamadas reais.

DESC="STFC 3000 simultaneas: 10 CPS, hold 300 s, janela 420 s, so sinalizacao. EXIGE fs-limites 4200 nos 2 FS"
ZABBIX_ENABLED=1
TESTS=sip
CPS=10
CPS_START=10
WINDOW=420
HOLD=300
MEDIA=none
LABEL=stfc-c3000
