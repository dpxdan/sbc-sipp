# stfc-c3000 - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-c3000.conf no .165 (ZABBIX.md).
# 3000 chamadas simultaneas a 10 CPS (chamadas de 300 s): degrau do A14 (RESULTADOS.md, secao 8).
# Patamar de 120 s em 3000 simultaneas; ~14 min com baseline, drenagem e cooldown.
#
# ANTES de disparar (ZABBIX.md, "Perfis de 3000 e 5000 simultaneas"):
#   - nos dois FS: bash fs-limites.sh aplicar 150 3500
#   - no .163: opensips-cli -x mi lb_list mostrando max >= 3500 nos dois nos
# Com max_sessions 5000 em uso (fs-limites.sh mostrar), o aplicar mantem 5000 e o perfil cabe.
# Com 2000, o FS chega ao teto e responde 503 tambem para as chamadas reais.

DESC="STFC 3000 simultaneas: 10 CPS, hold 300 s, janela 420 s, so sinalizacao. EXIGE fs-limites 3500 nos 2 FS"
ZABBIX_ENABLED=1
TESTS=sip
CPS=10
CPS_START=10
WINDOW=420
HOLD=300
MEDIA=none
LABEL=stfc-c3000
