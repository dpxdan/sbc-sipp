# stfc-piloto - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-piloto.conf no .165 (ZABBIX.md).
# Equivale a: flux-loadtest.sh run --confirm-prod -y -t sip -r 10 -H 10 -w 60 -M none

DESC="STFC piloto: 10 CPS por 60 s, so sinalizacao"
ZABBIX_ENABLED=1
TESTS=sip
CPS=10
WINDOW=60
HOLD=10
MEDIA=none
LABEL=stfc-piloto
