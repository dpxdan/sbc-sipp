# stfc-c2000 - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-c2000.conf no .165 (ZABBIX.md).
# 2000 chamadas simultaneas a 10 CPS (chamadas de 200 s): meta de 2000 da WEB-1437.
# Patamar de 120 s em 2000 simultaneas; ~13 min com baseline, drenagem e cooldown.
#
# ANTES de disparar (ZABBIX.md, "Perfis de 2000, 3000 e 5000 simultaneas"):
#   - nos dois FS: bash fs-limites.sh aplicar 150 2800
#   - no .163: opensips-cli -x mi lb_list mostrando max perto de 2800 x CPU ociosa nos dois nos
# Regra: max_sessions = 1,4 x simultaneas. Em 21/10/2026, com 2000 por FS, o .162 chegou ao teto
# (503 Maximum Calls In Progress) com 1962 simultaneas. Com 3500 ou 5000 em uso
# (fs-limites.sh mostrar), o aplicar mantem o valor atual e o perfil cabe.

DESC="STFC 2000 simultaneas: 10 CPS, hold 200 s, janela 320 s, so sinalizacao. EXIGE fs-limites 2800 nos 2 FS"
ZABBIX_ENABLED=1
TESTS=sip
CPS=10
CPS_START=10
WINDOW=320
HOLD=200
MEDIA=none
LABEL=stfc-c2000
