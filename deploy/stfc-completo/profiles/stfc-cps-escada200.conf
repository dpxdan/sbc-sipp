# stfc-cps-escada200 - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-cps-escada200.conf no .165 (ZABBIX.md).
# Meta da WEB-1437: 200 CPS com ~2000 simultaneas (hold de 10 s). Patamares de 60 s de 100 a 200 CPS
# (+20) e 180 s em 200. ~13 min no total. pdd-pcap.py --faixa 60 separa os patamares.
#
# ANTES de disparar (docs/execucao/degraus-e-perfis.md, "Acima de 50 CPS"):
#   - nos dois FS: bash fs-limites.sh aplicar 250 2800
#   - GUARD_MAX_PDD_MS e GUARD_MAX_OS_SHM_PCT no /etc/flux-loadtest/loadtest.conf (o wrapper exige)
#   - ZBX_MAX_CPS de 200 ou mais no /etc/flux-loadtest/zabbix-runner.conf
#   - -m do OpenSIPS maior: com 64 MB, a memoria compartilhada esgota por volta de 130-150 CPS
# Depois da execucao, nos dois FS: bash fs-limites.sh restaurar

DESC="STFC escada de CPS: 100 a 200 CPS (+20 a cada 60 s), hold 10 s, so sinalizacao. EXIGE fs-limites 250 2800 nos 2 FS"
ZABBIX_ENABLED=1
TESTS=sip
CPS=200
CPS_START=100
RAMP_STEP=20
RAMP_INTERVAL=60
WINDOW=480
HOLD=10
MEDIA=none
LABEL=stfc-cps-escada200
