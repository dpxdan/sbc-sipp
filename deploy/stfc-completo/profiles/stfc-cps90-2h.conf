# stfc-cps90-2h - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-cps90-2h.conf no .165 (ZABBIX.md).
# T4 da migracao: 2 h em 90 CPS com a configuracao final, so sinalizacao. Procura vazamento de memoria e degradacao.
# Exige ZBX_MAX_WINDOW de 7500 no zabbix-runner.conf. ~2h08.
#
# ANTES de disparar (docs/execucao/migracao-14-11.md):
#   - nos dois FS: bash fs-limites.sh aplicar 150 1260 (mantem os limites maiores do switch.conf)
#   - GUARD_MAX_PDD_MS, GUARD_MAX_OS_SHM_PCT e GUARD_MAX_DB_CONN_PCT no loadtest.conf (o wrapper exige)
# Depois da execucao, nos dois FS: bash fs-limites.sh restaurar

DESC="STFC 90 CPS por 2 h, rampa de 45 a 90 (+9/60 s), hold 10 s, so sinalizacao. EXIGE fs-limites 150 1260"
ZABBIX_ENABLED=1
TESTS=sip
CPS=90
CPS_START=45
RAMP_STEP=9
RAMP_INTERVAL=60
WINDOW=7500
HOLD=10
MEDIA=none
LABEL=stfc-cps90-2h
