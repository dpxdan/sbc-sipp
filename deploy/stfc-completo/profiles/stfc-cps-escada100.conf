# stfc-cps-escada100 - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-cps-escada100.conf no .165 (ZABBIX.md).
# Meta da WEB-1437: 100 CPS com ~1000 simultaneas (hold de 10 s). Patamares de 60 s de 50 a 100 CPS
# (+10) e 180 s em 100. ~13 min no total. pdd-pcap.py --faixa 60 separa os patamares.
#
# ANTES de disparar (docs/execucao/degraus-e-perfis.md, "Acima de 50 CPS"):
#   - nos dois FS: bash fs-limites.sh aplicar 150 1400
#   - GUARD_MAX_PDD_MS e GUARD_MAX_OS_SHM_PCT no /etc/flux-loadtest/loadtest.conf (o wrapper exige)
#   - ZBX_MAX_CPS de 100 ou mais no /etc/flux-loadtest/zabbix-runner.conf
# Depois da execucao, nos dois FS: bash fs-limites.sh restaurar

DESC="STFC escada de CPS: 50 a 100 CPS (+10 a cada 60 s), hold 10 s, so sinalizacao. EXIGE fs-limites 150 1400 nos 2 FS"
ZABBIX_ENABLED=1
TESTS=sip
CPS=100
CPS_START=50
RAMP_STEP=10
RAMP_INTERVAL=60
WINDOW=480
HOLD=10
MEDIA=none
LABEL=stfc-cps-escada100
