# stfc-c5000 - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-c5000.conf no .165 (ZABBIX.md).
# 5000 chamadas simultaneas a 10 CPS (chamadas de 500 s), alem das metas da WEB-1437.
# Patamar de 120 s em 5000 simultaneas; ~21 min com baseline, drenagem e cooldown.
# Rodar so depois de um stfc-c3000 sem falhas.
#
# ANTES de disparar (ZABBIX.md, "Perfis de 3000 e 5000 simultaneas"):
#   - nos dois FS: bash fs-limites.sh aplicar 150 5500
#   - no .163: opensips-cli -x mi lb_list mostrando max >= 5500 nos dois nos
#   - memoria, threads, portas RTP e timeout de midia dos FS conferidos
# Mesmo com max_sessions 5000 no switch.conf, o 5500 e necessario: o teste ocupa ~5000
# sessoes por FS e o trafego real passaria do teto, recebendo 503.

DESC="STFC 5000 simultaneas: 10 CPS, hold 500 s, janela 620 s, so sinalizacao. EXIGE fs-limites 5500 nos 2 FS"
ZABBIX_ENABLED=1
TESTS=sip
CPS=10
CPS_START=10
WINDOW=620
HOLD=500
MEDIA=none
LABEL=stfc-c5000
