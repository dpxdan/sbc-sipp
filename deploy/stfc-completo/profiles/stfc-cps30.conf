# stfc-cps30 - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-cps30.conf no .165 (ZABBIX.md).
# Mede CPS, nao simultaneas: banco (core-db-dsn e roteamento), sps dos FS e o atraso do .162
# acima de ~20 CPS (A1). Rampa de 10 a 30 CPS em 80 s e ~220 s em 30 CPS.
# Hold de 30 s: ~900 simultaneas no patamar, longe do max_sessions. ~10 min no total.
#
# ANTES de disparar (ZABBIX.md, "Perfil de CPS"):
#   - nos dois FS: bash fs-limites.sh aplicar 150 1300
#     (sps conta sessoes: 30 CPS x 2 x ~55% = ~33 por FS; 1300 = 1,4 x 900 simultaneas)
# Depois da execucao, nos dois FS: bash fs-limites.sh restaurar

DESC="STFC 30 CPS sustentados por ~220 s, hold 30 s, so sinalizacao. EXIGE fs-limites 150 1300 nos 2 FS"
ZABBIX_ENABLED=1
TESTS=sip
CPS=30
CPS_START=10
RAMP_STEP=5
RAMP_INTERVAL=20
WINDOW=300
HOLD=30
MEDIA=none
LABEL=stfc-cps30
