# stfc-cps-escada-fina - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-cps-escada-fina.conf no .165 (ZABBIX.md).
# Escada fina em volta do teto medido em 27/10/2026 (20 CPS estavel, 25 CPS com o atraso subindo):
# patamares de 60 s em 16, 18, 20, 22, 24 e 26 CPS e mais 60 s em 26. ~12 min no total.
# E a rodada A e a rodada B do A/B do core db (docs/execucao/ab-core-db.md): mesma escada antes e
# depois da troca, com captura no gerador e nos dois FS.
#
# ANTES de disparar:
#   - nos dois FS: bash fs-limites.sh aplicar 150 1300 e conferir com fs-limites.sh mostrar
#     (em 27/10 o .162 ficou com sps 50 em uso)
#   - GUARD_MAX_PDD_MS=2000 no /etc/flux-loadtest/loadtest.conf
#   - capturas: .165 (5060/5090), .162 (5070) e .163 (5070) durante toda a janela
# Depois da execucao, nos dois FS: bash fs-limites.sh restaurar

DESC="STFC escada fina de CPS: 16 a 26 CPS (+2 a cada 60 s), hold 10 s, so sinalizacao. EXIGE fs-limites 150 1300 nos 2 FS"
ZABBIX_ENABLED=1
TESTS=sip
CPS=26
CPS_START=16
RAMP_STEP=2
RAMP_INTERVAL=60
WINDOW=420
HOLD=10
MEDIA=none
LABEL=stfc-cps-escada-fina
