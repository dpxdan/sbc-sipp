# stfc-cps20 - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-cps20.conf no .165 (ZABBIX.md).
# 20 CPS e o maior valor com atraso aceitavel medido em 21/10/2026 (RESULTADOS.md, A1).
# A rampa chega a 20 CPS em 40 s e fica la por ~3 minutos.

DESC="STFC 20 CPS sustentados por 240 s, hold 20 s, so sinalizacao"
ZABBIX_ENABLED=1
TESTS=sip
CPS=20
CPS_START=10
RAMP_STEP=5
RAMP_INTERVAL=20
WINDOW=240
HOLD=20
MEDIA=none
LABEL=stfc-cps20
