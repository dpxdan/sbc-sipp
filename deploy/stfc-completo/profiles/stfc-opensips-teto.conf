# stfc-opensips-teto - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-opensips-teto.conf no .165 (ZABBIX.md).
# T5 (opcional): teto do OpenSIPS. INVITE a 90 CPS pelo caminho real (rampa de 45 a 90, +9/60 s)
# e, a partir de 300 s, escada de OPTIONS de 500 a 5000/s (+500/60 s), que o OpenSIPS responde
# sozinho, sem banco e sem FS. Para no primeiro guard: falha ou resposta de OPTIONS (limite do
# OpenSIPS) ou CPU do .163 (o host divide a CPU com um FS). ~20 min.
#
# ANTES de disparar (docs/execucao/migracao-14-11.md):
#   - nos dois FS: bash fs-limites.sh aplicar 150 1260 (mantem os limites maiores do switch.conf)
#   - GUARD_MAX_PDD_MS, GUARD_MAX_OS_SHM_PCT e GUARD_MAX_DB_CONN_PCT no loadtest.conf (o wrapper exige)
#   - GUARD_MAX_OPTIONS_FAIL_PCT e GUARD_MAX_OPTIONS_RT_MS no loadtest.conf (o wrapper exige)
#   - OPTIONS_LOCAL_PORT livre no .165
# Depois da execucao, nos dois FS: bash fs-limites.sh restaurar

DESC="STFC teto do OpenSIPS: INVITE a 90 CPS e OPTIONS de 500 a 5000/s (+500/60 s). EXIGE fs-limites 150 1260"
ZABBIX_ENABLED=1
TESTS=sip,options
CPS=90
CPS_START=45
RAMP_STEP=9
RAMP_INTERVAL=60
WINDOW=1020
HOLD=10
MEDIA=none
OPTIONS_DELAY=300
OPTIONS_START=500
OPTIONS_STEP=500
OPTIONS_INTERVAL=60
OPTIONS_MAX=5000
LABEL=stfc-opensips-teto
