# stfc-c1000 - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-c1000.conf no .165 (ZABBIX.md).
# 1000 chamadas simultaneas a 10 CPS (chamadas de 100 s), como o stfc-meta-c1000 de 21/10/2026.

DESC="STFC 1000 simultaneas: 10 CPS, hold 100 s, janela 150 s, so sinalizacao"
ZABBIX_ENABLED=1
TESTS=sip
CPS=10
CPS_START=10
WINDOW=150
HOLD=100
MEDIA=none
LABEL=stfc-c1000
