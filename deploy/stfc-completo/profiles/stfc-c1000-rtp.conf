# stfc-c1000-rtp - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-c1000-rtp.conf no .165 (ZABBIX.md).
# Mesma carga do stfc-c1000 (1000 simultaneas a 10 CPS, chamadas de 100 s), com RTP G.711 nos
# dois sentidos: o A/B entre os dois mede o custo da midia nos FS ("variar tratamento de midia",
# WEB-1437). A campanha de 21/10/2026 rodou toda sem RTP.
#
# ANTES de disparar:
#   - DIDs com bypass_media = 0 (o FS ancora o RTP das duas pernas); com 1 o RTP passa direto
#     entre originador e atendedor e o teste nao mede midia nos FS (docs/instalacao/massa-dids.md)
#   - firewall do .165 liberando, vindos dos FS, as faixas RTP a partir de RTP_PORT_BASE e de
#     UAS_RTP_PORT_BASE (README.md, secao 1.3)
#   - flux-loadtest.sh capacidade --hold 100: portas RTP e timeout de midia dos FS
# Gerador no .165: ~2000 fluxos G.711 enviados (originador + atendedor), ~180 Mbit/s e ~100 mil
# pps por sentido, dividindo CPU com a interface web. GUARD_MAX_GEN_CPU_PCT para o teste se a VM
# saturar. udp_rcvbuf_err_s alto no gerador e esperado: o SIPp nao consome o RTP devolvido.

DESC="STFC 1000 simultaneas com RTP: 10 CPS, hold 100 s, janela 150 s, G.711 nos dois sentidos"
ZABBIX_ENABLED=1
TESTS=sip
CPS=10
CPS_START=10
WINDOW=150
HOLD=100
MEDIA=rtp
LABEL=stfc-c1000-rtp
