# stfc-cps-escada300 - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-cps-escada300.conf no .165 (ZABBIX.md).
# Meta da WEB-1437: 300 CPS com ~3000 simultaneas (hold de 10 s). Patamares de 60 s de 150 a 300 CPS
# (+30) e 180 s em 300. ~13 min no total. pdd-pcap.py --faixa 60 separa os patamares.
#
# ANTES de disparar (docs/execucao/degraus-e-perfis.md, "Acima de 50 CPS"):
#   - nos dois FS: bash fs-limites.sh aplicar 350 4200
#   - GUARD_MAX_PDD_MS e GUARD_MAX_OS_SHM_PCT no /etc/flux-loadtest/loadtest.conf (o wrapper exige)
#   - ZBX_MAX_CPS de 300 ou mais no /etc/flux-loadtest/zabbix-runner.conf
#   - -m do OpenSIPS maior: com 64 MB, a memoria compartilhada esgota por volta de 130-150 CPS
# Depois da execucao, nos dois FS: bash fs-limites.sh restaurar

DESC="STFC escada de CPS: 150 a 300 CPS (+30 a cada 60 s), hold 10 s, so sinalizacao. EXIGE fs-limites 350 4200 nos 2 FS"
ZABBIX_ENABLED=1
TESTS=sip
CPS=300
CPS_START=150
RAMP_STEP=30
RAMP_INTERVAL=60
WINDOW=480
HOLD=10
MEDIA=none
LABEL=stfc-cps-escada300
