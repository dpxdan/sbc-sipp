# stfc-cps-escada50 - perfil do disparo pelo Zabbix no STFC (bin/flux-loadtest-zbx)
# Copie para /etc/flux-loadtest/profiles.d/stfc-cps-escada50.conf no .165 (ZABBIX.md).
# Escada de CPS para achar o limite (docs/execucao/degraus-e-perfis.md, "Encontrar o limite de CPS"):
# patamares de 60 s em 10, 15, 20, ..., 50 CPS e mais 120 s em 50. ~16 min no total.
# Hold de 10 s: ~600 simultaneas em 50 CPS, longe da faixa em que o .162 degrada por concorrencia;
# a escada mede CPS, nao simultaneas. pdd-pcap.py --faixa 60 separa os patamares.
#
# ANTES de disparar:
#   - nos dois FS: bash fs-limites.sh aplicar 150 1300
#     (sps conta sessoes: 50 CPS x 2 x ~55% = ~55 no .162; tira o sps 50 do .162 da medicao)
#   - GUARD_MAX_PDD_MS=2000 no /etc/flux-loadtest/loadtest.conf: para a carga quando o INVITE -> 200
#     medio passa de 2 s, o que tambem atingiria as chamadas reais
#   - capturas: tcpdump no .165 (5060/5090) e no .162 (5070) durante toda a janela
# Depois da execucao, nos dois FS: bash fs-limites.sh restaurar

DESC="STFC escada de CPS: 10 a 50 CPS (+5 a cada 60 s), hold 10 s, so sinalizacao. EXIGE fs-limites 150 1300 nos 2 FS"
ZABBIX_ENABLED=1
TESTS=sip
CPS=50
CPS_START=10
RAMP_STEP=5
RAMP_INTERVAL=60
WINDOW=660
HOLD=10
MEDIA=none
LABEL=stfc-cps-escada50
