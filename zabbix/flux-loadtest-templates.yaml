zabbix_export:
  version: '7.2'
  template_groups:
    - uuid: 93f8f439d8444a1c89383a7bfd007f8e
      name: 'Templates/Flux Loadtest'
  templates:
    - uuid: 724b2efd682c40f6bdacdf7d5ed84ec2
      template: 'Flux Loadtest - Sistema'
      name: 'Flux Loadtest - Sistema'
      description: 'Metricas de sistema do coletor do flux-loadtest (metrics/<id>.csv), enviadas por trapper na chave flt.sys. Vincular a todos os hosts do teste.'
      groups:
        - name: 'Templates/Flux Loadtest'
      items:
      - uuid: c4842d21f5b948549e6664dae280832d
        name: 'Amostra de sistema (JSON)'
        type: TRAP
        key: 'flt.sys'
        delay: '0'
        history: '0'
        trends: '0'
        value_type: TEXT
        description: 'Trapper: JSON de uma amostra, enviado pelo flux-loadtest.'
        tags:
          - tag: 'component'
            value: 'raw'
      - uuid: 856a792044bd4f7698c70c895e5584cc
        name: 'CPU total'
        type: DEPENDENT
        key: 'flt.sys[cpu_pct]'
        delay: '0'
        history: 90d
        value_type: FLOAT
        units: '%'
        preprocessing:
          - type: JSONPATH
            parameters:
              - '$.cpu_pct'
            error_handler: DISCARD_VALUE
        master_item:
          key: 'flt.sys'
        tags:
          - tag: 'component'
            value: 'sistema'
        triggers:
          - uuid: 2dde91bf8baa410394de7891d3ce007e
            expression: 'min(/Flux Loadtest - Sistema/flt.sys[cpu_pct],#3)>{$FLT.CPU.MAX}'
            recovery_mode: RECOVERY_EXPRESSION
            recovery_expression: 'max(/Flux Loadtest - Sistema/flt.sys[cpu_pct],#3)<={$FLT.CPU.MAX} or nodata(/Flux Loadtest - Sistema/flt.sys[cpu_pct],{$FLT.NODATA})=1'
            name: 'CPU acima de {$FLT.CPU.MAX}% por 3 amostras em {HOST.NAME}'
            opdata: '{ITEM.LASTVALUE1}'
            priority: HIGH
            manual_close: 'YES'
            tags:
              - tag: 'scope'
                value: 'loadtest'
      - uuid: bc5d77068b5c493e9f0d097c3d81e838
        name: 'CPU do nucleo mais carregado'
