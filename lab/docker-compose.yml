# Laboratorio STFC do flux-loadtest (WEB-1437)
#
# Replica a topologia de producao com redes do Docker:
#   stfc_int 172.30.4.0/24    = rede interna 172.17.4.0/24 (172.17/16 e do Docker; 172.18/16 ja usada)
#   stfc_pub 172.30.177.0/24  = IPs publicos 200.159.177.x (mesmos finais)
# A vm-teste fica so na rede "publica", como a VM no Parallels: nao alcanca o VIP.
#   zbx      172.30.10.0/24   Zabbix (server, web e PostgreSQL); server e web tambem na "publica"
#
# Acesso a partir do macOS (Docker Desktop nao roteia para os IPs dos containers):
# portas publicadas so em 127.0.0.1, configuraveis no .env (LAB_PORT_*). Ver "lab.sh status".
#
# Use pelo lab.sh (gera o .env com as senhas e a configuracao do flux-loadtest).

name: flux-stfc-lab

networks:
  stfc_int:
    ipam:
      config:
        - subnet: 172.30.4.0/24
  stfc_pub:
    ipam:
      config:
        - subnet: 172.30.177.0/24
  zbx:
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  # Historico do Zabbix sobrevive ao "lab.sh down" (apagar: lab.sh down --zabbix)
  zbx-db:

# Token da SignalWire para os pacotes do FreeSWITCH: entra so no build (secret do BuildKit)
secrets:
  signalwire_token:
    file: ${LAB_SIGNALWIRE_TOKEN_FILE:-${HOME}/.config/flux-lab/signalwire.token}

services:
  # SBC real (padrao): OpenSIPS 3.6 + FreeSWITCH 1.11.3 com os scripts do Flux (LAB_FLUX_SRC).
  # LAB_SBC_TARGET=sbc volta ao SBC simulado com SIPp (sem token e sem o repositorio sbc).
  sbc-stfc-1:
    build:
      context: images
      target: ${LAB_SBC_TARGET:-sbc-real}
      secrets: [signalwire_token]
    image: flux-stfc-lab/${LAB_SBC_TARGET:-sbc-real}
    hostname: sbc-stfc-1
    env_file: .env
    environment:
      LAB_SIP_ROLES: "opensips fs"
      LAB_PUB_IP: 172.30.177.163
      LAB_INT_IP: 172.30.4.163
      LAB_RTP_START: ${LAB_RTP1_START:-16384}
      LAB_RTP_END: ${LAB_RTP1_END:-16583}
      LAB_MAC_SIP_PORT: ${LAB_PORT_SIP:-5060}
    volumes:
      - ${LAB_FLUX_SRC:-${HOME}/Desenvolvedor/Flux/Repositorio/dpxdan/sbc}:/opt/flux-src:ro
      # scripts Lua do FreeSWITCH (padrao: snapshot de producao do sbc01)
      - ${LAB_FLUX_SCRIPTS:-${HOME}/Desenvolvedor/Flux/Servidores/flux-sbcbr/sbc01/freeswitch/scripts}:/opt/flux-scripts:ro
    ports:
      - "127.0.0.1:${LAB_PORT_SSH_SBC1:-22163}:22"
      # SIP dos devices do macOS -> socket 5062 do OpenSIPS (anuncia 127.0.0.1:LAB_PORT_SIP)
      - "127.0.0.1:${LAB_PORT_SIP:-5060}:5062/udp"
      # RTP do FreeSWITCH deste no (mesma faixa dentro e fora)
      - "127.0.0.1:${LAB_RTP1_START:-16384}-${LAB_RTP1_END:-16583}:${LAB_RTP1_START:-16384}-${LAB_RTP1_END:-16583}/udp"
    networks:
      stfc_int: { ipv4_address: 172.30.4.163 }
      stfc_pub: { ipv4_address: 172.30.177.163 }

  sbc-stfc-02:
    build:
      context: images
      target: ${LAB_SBC_TARGET:-sbc-real}
      secrets: [signalwire_token]
    image: flux-stfc-lab/${LAB_SBC_TARGET:-sbc-real}
    hostname: sbc-stfc-02
    env_file: .env
    environment:
      LAB_SIP_ROLES: "fs"
      LAB_PUB_IP: 172.30.177.162
      LAB_INT_IP: 172.30.4.162
      LAB_RTP_START: ${LAB_RTP2_START:-16584}
      LAB_RTP_END: ${LAB_RTP2_END:-16783}
    volumes:
      - ${LAB_FLUX_SRC:-${HOME}/Desenvolvedor/Flux/Repositorio/dpxdan/sbc}:/opt/flux-src:ro
      # scripts Lua do FreeSWITCH (padrao: snapshot de producao do sbc01)
      - ${LAB_FLUX_SCRIPTS:-${HOME}/Desenvolvedor/Flux/Servidores/flux-sbcbr/sbc01/freeswitch/scripts}:/opt/flux-scripts:ro
    ports:
      - "127.0.0.1:${LAB_PORT_SSH_SBC2:-22162}:22"
      - "127.0.0.1:${LAB_RTP2_START:-16584}-${LAB_RTP2_END:-16783}:${LAB_RTP2_START:-16584}-${LAB_RTP2_END:-16783}/udp"
    networks:
      stfc_int: { ipv4_address: 172.30.4.162 }
      stfc_pub: { ipv4_address: 172.30.177.162 }

  banco-master-sbc-stfc:
    build: { context: images, target: db }
    image: flux-stfc-lab/db
    hostname: banco-master-sbc-stfc
    env_file: .env
    cap_add: [NET_ADMIN, NET_RAW, NET_BROADCAST]
    environment:
      LAB_DB_NODE: "1"
      LAB_DB_ADDR: 172.30.4.161
      LAB_DB_PEER: 172.30.4.164
      LAB_VRRP_PRIORITY: "150"
    ports:
      - "127.0.0.1:${LAB_PORT_SSH_DB1:-22161}:22"
    networks:
      stfc_int: { ipv4_address: 172.30.4.161 }
      stfc_pub: { ipv4_address: 172.30.177.161 }

  banco-slave-stfc:
    build: { context: images, target: db }
    image: flux-stfc-lab/db
    hostname: banco-slave-stfc
    env_file: .env
    cap_add: [NET_ADMIN, NET_RAW, NET_BROADCAST]
    depends_on: [banco-master-sbc-stfc]
    environment:
      LAB_DB_NODE: "2"
      LAB_DB_ADDR: 172.30.4.164
      LAB_DB_PEER: 172.30.4.161
      LAB_VRRP_PRIORITY: "100"
    ports:
      - "127.0.0.1:${LAB_PORT_SSH_DB2:-22164}:22"
    networks:
      stfc_int: { ipv4_address: 172.30.4.164 }
      stfc_pub: { ipv4_address: 172.30.177.164 }

  sbc-stfc-interfaceweb:
    build: { context: images, target: web }
    image: flux-stfc-lab/web
    hostname: sbc-stfc-interfaceweb
    env_file: .env
    ports:
      - "127.0.0.1:${LAB_PORT_WEB_HTTPS:-8443}:443"
      - "127.0.0.1:${LAB_PORT_WEB_HTTP:-8081}:80"
      - "127.0.0.1:${LAB_PORT_SSH_WEB:-22165}:22"
    networks:
      stfc_int: { ipv4_address: 172.30.4.165 }
      stfc_pub: { ipv4_address: 172.30.177.165 }

  vm-teste:
    build: { context: images, target: gen }
    image: flux-stfc-lab/gen
    hostname: vm-teste
    volumes:
      - ../:/opt/flux-loadtest:ro
      - ./out:/etc/flux-loadtest
      - ./out/results:/var/lib/flux-loadtest/results
    networks:
      stfc_pub: { ipv4_address: 172.30.177.50 }

  # ------------------------------------------------------------------ Zabbix
  zabbix-db:
    image: postgres:17-bookworm
    hostname: zabbix-db
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${LAB_ZBX_DB_PASSWORD:?rode lab.sh up}
    volumes:
      - zbx-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      retries: 30
    networks:
      zbx: { ipv4_address: 172.30.10.5 }

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-${LAB_ZABBIX_VERSION:-7.4.15}
    hostname: zabbix-server
    depends_on:
      zabbix-db: { condition: service_healthy }
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${LAB_ZBX_DB_PASSWORD:?rode lab.sh up}
      ZBX_CACHESIZE: 64M
      ZBX_STARTTRAPPERS: "10"
    ports:
      - "127.0.0.1:${LAB_PORT_ZABBIX_TRAPPER:-10051}:10051"
    networks:
      zbx: { ipv4_address: 172.30.10.10 }
      stfc_pub: { ipv4_address: 172.30.177.10 }

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-${LAB_ZABBIX_VERSION:-7.4.15}
    hostname: zabbix-web
    depends_on: [zabbix-server]
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_NAME: Flux STFC lab
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${LAB_ZBX_DB_PASSWORD:?rode lab.sh up}
      PHP_TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${LAB_PORT_ZABBIX_WEB:-8080}:8080"
    networks:
      zbx: { ipv4_address: 172.30.10.11 }
      stfc_pub: { ipv4_address: 172.30.177.11 }
