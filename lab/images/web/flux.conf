# Laboratorio STFC: vhost no formato do deb_flux.conf, mais os enderecos de status.
server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    server_name _;

    root /var/www/flux;
    index index.php;

    ssl_certificate     /etc/nginx/lab.crt;
    ssl_certificate_key /etc/nginx/lab.key;

    access_log /var/log/nginx/flux_access.log;
    error_log  /var/log/nginx/flux_error.log;

    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    location = /fpm-status {
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-status;
        fastcgi_param SCRIPT_FILENAME /fpm-status;
        fastcgi_pass unix:/run/php/php7.3-fpm.sock;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php7.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
